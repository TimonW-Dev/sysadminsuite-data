name: Sync MAC Vendors

on:
  schedule:
    # Every Sunday 03:00 UTC; the guard step limits real runs to the first Sunday of the month.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mac-vendors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for first Sunday of the month
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the first Sunday of the month, skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Generate MAC vendor shards
        if: steps.guard.outputs.run == 'true'
        run: python scripts/shard_mac_data.py

      - name: Commit and push changes
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/mac-vendors
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update MAC vendor shards"
            git push
          fi
